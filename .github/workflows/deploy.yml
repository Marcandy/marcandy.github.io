name: Publish portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production source
        uses: actions/checkout@v6
        with:
          path: source

      - name: Validate portfolio
        run: node source/scripts/validate.mjs

      - name: Check out current Pages branch
        uses: actions/checkout@v6
        with:
          ref: updateCover
          path: publish

      - name: Stage public files
        run: |
          git -C publish rm -r .
          mkdir -p publish/assets
          cp source/index.html source/404.html source/styles.css source/robots.txt source/sitemap.xml source/.nojekyll publish/
          cp -r source/assets/. publish/assets/
          cp -r source/projects publish/projects
          cp -r source/img publish/img

      - name: Publish to the existing Pages source
        working-directory: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No public site changes to publish."
          else
            git commit -m "Deploy portfolio from master"
            git push origin HEAD:updateCover
          fi
